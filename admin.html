<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Quản lý bài tập</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Passcode Overlay (Giữ nguyên) -->
    <div id="lockScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col justify-center items-center p-4 text-white">
        <div class="w-full max-w-sm bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 text-center">
            <div class="text-5xl mb-4">🔐</div>
            <h2 class="text-2xl font-bold mb-2">Yêu cầu quyền truy cập</h2>
            <input type="password" id="passInput" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-center mb-4 text-xl outline-none focus:border-indigo-500 transition">
            <button onclick="verifyPassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded-lg font-bold transition">Đăng nhập</button>
            <a href="index.html" class="block mt-4 text-sm text-slate-500">Quay lại trang chủ</a>
        </div>
    </div>

    <!-- Main Content -->
    <div id="adminMainContent" class="hidden">
        <header class="bg-white shadow-sm border-b px-8 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <span class="bg-indigo-600 text-white p-1 rounded font-mono">Admin</span> Control Panel
            </h1>
            <a href="index.html" class="text-sm text-indigo-600 font-medium hover:underline">← Xem trang của học sinh</a>
        </header>

        <main class="max-w-6xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form bên trái: Thêm/Sửa bài -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="formTitle" class="text-lg font-bold text-gray-700">Tạo bài tập mới</h3>
                        <button id="cancelBtn" onclick="resetForm()" class="hidden text-xs text-red-500 hover:underline">Hủy sửa bài</button>
                    </div>

                    <!-- ID ẩn để biết đang sửa bài nào -->
                    <input type="hidden" id="editingId" value="">

                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-semibold text-gray-400 uppercase">Tiêu đề bài tập</label>
                            <input type="text" id="title" class="w-full mt-1 p-3 border rounded-lg outline-none focus:ring-2 ring-indigo-100 border-gray-200">
                        </div>
                        
                        <div>
                            <label class="text-xs font-semibold text-gray-400 uppercase">Mô tả chi tiết</label>
                            <textarea id="desc" rows="5" class="w-full mt-1 p-3 border rounded-lg outline-none focus:ring-2 ring-indigo-100 border-gray-200"></textarea>
                        </div>
                        
                        <div id="testCasesContainer">
                            <label class="text-sm font-semibold text-gray-500 uppercase tracking-tight">Test Cases (Nhập dạng văn bản thuần cho C++)</label>
                            <!-- Các test case sẽ hiện ở đây -->
                        </div>

                        <button onclick="addTestCaseField()" class="text-sm text-indigo-600 hover:underline">+ Thêm trường hợp thử nghiệm</button>

                        <button id="saveBtn" onclick="saveProblem()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
                            LƯU BÀI TẬP
                        </button>
                    </div>
                </div>
            </div>

            <!-- Danh sách bên phải -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-lg font-bold mb-4 text-gray-700 uppercase text-xs tracking-widest">Danh sách bài tập</h3>
                    <div id="existingProblems" class="space-y-2">
                        <!-- Items -->
                    </div>
                </div>

                <!-- Đổi mật mã (Giữ nguyên) -->
                <div class="bg-slate-800 p-6 rounded-xl text-white shadow-xl">
                    <h3 class="font-bold mb-3 text-sm italic text-slate-400">Security</h3>
                    <input type="text" id="newPassInput" class="w-full bg-slate-700 border-none rounded p-2 mb-3 text-sm outline-none focus:ring-1 ring-slate-500" placeholder="Mật mã mới">
                    <button onclick="changeAdminPass()" class="w-full bg-slate-600 p-2 rounded text-xs hover:bg-slate-500 transition">Cập nhật mật mã</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentPass = localStorage.getItem('admin_password') || '1234';

        function verifyPassword() {
            if (document.getElementById('passInput').value === currentPass) {
                document.getElementById('lockScreen').remove();
                document.getElementById('adminMainContent').classList.remove('hidden');
                loadExistingProblems();
                resetForm(); // Khởi tạo 1 test case trống
            } else { alert('Mật mã không đúng!'); }
        }

        function loadExistingProblems() {
            const problems = JSON.parse(localStorage.getItem('problems') || '[]');
            const container = document.getElementById('existingProblems');
            container.innerHTML = '';
            problems.forEach(p => {
                const div = document.createElement('div');
                div.className = 'group flex justify-between items-center p-3 border border-transparent hover:border-indigo-200 hover:bg-indigo-50 rounded-lg transition cursor-pointer';
                div.innerHTML = `
                    <span class="text-sm font-medium text-gray-600 group-hover:text-indigo-700" onclick="startEdit(${p.id})">${p.title}</span> 
                    <button class="text-gray-300 hover:text-red-500 text-[10px] uppercase font-bold" onclick="deleteProblem(${p.id})">Xóa</button>
                `;
                container.appendChild(div);
            });
        }

        // --- HÀM THÊM Ô NHẬP TEST CASE ---
        function addTestCaseField(valInput = '', valOutput = '') {
            const container = document.getElementById('testCasesContainer');
            const div = document.createElement('div');
            div.className = 'test-case-row mt-2 p-3 bg-slate-50 rounded-lg border flex gap-2 items-center';
            div.innerHTML = `
                <input type="text" class="input-val w-full p-2 border rounded text-sm" placeholder="Input" value="${valInput}">
                <input type="text" class="output-val w-full p-2 border rounded text-sm" placeholder="Output" value="${valOutput}">
                <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 px-1">×</button>
            `;
            container.appendChild(div);
        }

        // --- BẮT ĐẦU CHẾ ĐỘ SỬA BÀI ---
        function startEdit(id) {
            const problems = JSON.parse(localStorage.getItem('problems') || '[]');
            const p = problems.find(x => x.id === id);
            if (!p) return;

            // Đổ dữ liệu vào form
            document.getElementById('editingId').value = p.id;
            document.getElementById('title').value = p.title;
            document.getElementById('desc').value = p.desc;
            
            // Đổi giao diện form sang màu cam nhẹ để báo hiệu đang "Sửa"
            document.getElementById('formTitle').innerText = "Đang sửa bài: " + p.title;
            document.getElementById('saveBtn').innerText = "CẬP NHẬT THAY ĐỔI";
            document.getElementById('saveBtn').classList.replace('bg-indigo-600', 'bg-orange-500');
            document.getElementById('cancelBtn').classList.remove('hidden');

            // Xóa test cases cũ trong form và nạp test cases của bài này
            document.getElementById('testCasesContainer').innerHTML = '';
            p.testCases.forEach(tc => addTestCaseField(tc.input, tc.output));
            
            // Cuộn lên đầu trang
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- THOÁT CHẾ ĐỘ SỬA BÀI ---
        function resetForm() {
            document.getElementById('editingId').value = '';
            document.getElementById('title').value = '';
            document.getElementById('desc').value = '';
            document.getElementById('formTitle').innerText = "Tạo bài tập mới";
            document.getElementById('saveBtn').innerText = "LƯU BÀI TẬP";
            document.getElementById('saveBtn').classList.replace('bg-orange-500', 'bg-indigo-600');
            document.getElementById('cancelBtn').classList.add('hidden');
            
            document.getElementById('testCasesContainer').innerHTML = '';
            addTestCaseField(); // Thêm 1 dòng trống mặc định
        }

        // --- LƯU (THÊM HOẶC SỬA) ---
        function saveProblem() {
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;
            const editingId = document.getElementById('editingId').value;
            
            if (!title) { alert("Vui lòng nhập tên bài!"); return; }

            const inputs = document.querySelectorAll('.input-val');
            const outputs = document.querySelectorAll('.output-val');
            const testCases = [];
            inputs.forEach((input, index) => {
                if (input.value || outputs[index].value) {
                    testCases.push({ input: input.value, output: outputs[index].value });
                }
            });

            let problems = JSON.parse(localStorage.getItem('problems') || '[]');

            if (editingId) {
                // Chế độ Cập nhật
                const index = problems.findIndex(p => p.id == editingId);
                problems[index] = { ...problems[index], title, desc, testCases };
                alert('Đã cập nhật bài tập!');
            } else {
                // Chế độ Thêm mới
                problems.push({ id: Date.now(), title, desc, testCases });
                alert('Đã thêm bài mới!');
            }

            localStorage.setItem('problems', JSON.stringify(problems));
            loadExistingProblems();
            resetForm();
        }

        function deleteProblem(id) {
            if (confirm('Bạn có chắc muốn xóa bài tập này?')) {
                let p = JSON.parse(localStorage.getItem('problems') || '[]');
                localStorage.setItem('problems', JSON.stringify(p.filter(x => x.id !== id)));
                loadExistingProblems();
                if (document.getElementById('editingId').value == id) resetForm();
            }
        }

        function changeAdminPass() {
            const n = document.getElementById('newPassInput').value;
            if (n) { localStorage.setItem('admin_password', n); currentPass = n; alert('Đã đổi mật mã!'); }
        }
    </script>
</body>
</html>
