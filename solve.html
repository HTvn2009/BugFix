<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Luyện Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .editor-bg { background-color: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b px-6 py-3 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-gray-500 hover:text-gray-800 transition">← Return</a>
            <h1 id="probTitle" class="font-bold text-lg text-gray-800">Loading...</h1>
        </div>
        <button id="submitBtn" onclick="runAllTests()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-semibold transition flex items-center gap-2">
            <span>Submit</span>
        </button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Cột trái: Đề bài -->
        <div class="w-1/3 bg-white border-r overflow-y-auto p-6 custom-scrollbar">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-4">Problem describtion</h2>
            <div id="probDesc" class="text-gray-700 leading-relaxed text-lg whitespace-pre-wrap"></div>
        </div>

        <!-- Cột phải: Editor & Kết quả -->
        <div class="flex-1 flex flex-col bg-slate-900">
            <div class="flex-1 relative">
                <textarea id="codeEditor" spellcheck="false" class="w-full h-full p-6 editor-bg outline-none resize-none text-base">#include <iostream>
using namespace std;

int main() {
    int a, b;
    if(cin >> a >> b) {
        cout << a + b;
    }
    return 0;
}</textarea>
            </div>
            
            <!-- Khu vực kết quả -->
            <div id="resultArea" class="h-1/3 bg-white border-t p-6 overflow-y-auto custom-scrollbar shadow-2xl">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Result</h3>
                <div id="resultContent" class="space-y-2">
                    <p class="text-gray-400 italic text-sm"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const JUDGE0_API_URL = "https://ce.judge0.com"; 
        const params = new URLSearchParams(window.location.search);
        const probId = params.get('id');
        const problems = JSON.parse(localStorage.getItem('problems') || '[]');
        const problem = problems.find(p => p.id == probId);

        if (problem) {
            document.getElementById('probTitle').innerText = problem.title;
            document.getElementById('probDesc').innerText = problem.desc;
        }

        async function runAllTests() {
            const sourceCode = document.getElementById('codeEditor').value;
            const resContent = document.getElementById('resultContent');
            const btn = document.getElementById('submitBtn');
            
            btn.disabled = true;
            btn.innerText = "Pending...";
            resContent.innerHTML = `<div class="flex items-center gap-2 text-indigo-600"><svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Please wait...</div>`;
            
            let passedCount = 0;
            let report = "";

            for (let i = 0; i < problem.testCases.length; i++) {
                const tc = problem.testCases[i];
                const result = await submitToJudge0(sourceCode, tc.input, tc.output);
                
                if (result.status === "Accepted") {
                    passedCount++;
                    report += `<div class="p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm">Test Case ${i+1}: Accepted</div>`;
                } else {
                    report += `<div class="p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                        <b>Test Case ${i+1}: ${result.status}</b><br>
                        <span class="text-xs opacity-75 italic">Mong đợi: ${tc.output} | Nhận được: ${result.stdout || 'none'}</span>
                    </div>`;
                }
            }

            resContent.innerHTML = `
                <div class="mb-4 text-xl font-bold ${passedCount === problem.testCases.length ? 'text-green-600' : 'text-orange-500'}">
                    Result: ${passedCount}/${problem.testCases.length} accepted
                </div>
                <div class="space-y-2">${report}</div>
            `;
            btn.disabled = false;
            btn.innerText = "Nộp bài & Chấm điểm";
        }

        async function submitToJudge0(source_code, stdin, expected_output) {
            try {
                const response = await fetch(`${JUDGE0_API_URL}/submissions?base64_encoded=false&wait=false`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ source_code, language_id: 54, stdin, expected_output })
                });
                const { token } = await response.json();
                while (true) {
                    const statusRes = await fetch(`${JUDGE0_API_URL}/submissions/${token}?base64_encoded=false`);
                    const statusData = await statusRes.json();
                    if (statusData.status.id !== 1 && statusData.status.id !== 2) {
                        return { status: statusData.status.description, stdout: statusData.stdout ? statusData.stdout.trim() : "" };
                    }
                    await new Promise(r => setTimeout(r, 1000));
                }
            } catch (err) { return { status: "Error", stdout: "" }; }
        }
    </script>
</body>
</html>
